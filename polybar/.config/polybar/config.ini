; Barra principal com visual "material" (adi1090x/polybar-themes)
; mais a barra inferior de música (módulos custom do usuário).
;
; As cores principais vêm do pywal (~/.cache/wal/polybar-colors.ini,
; criado pelo launch_polybar.sh se ainda não existir) e as cores extras
; (foreground-alt, module-fg, alternate) do tema material.
include-file = ~/.config/polybar/material/colors.ini
include-file = ~/.cache/wal/polybar-colors.ini

[global/wm]
margin-bottom = 0
margin-top = 0

# ------------------------------------------------------------------
# Barra principal (topo)
# ------------------------------------------------------------------
[bar/main]
monitor = ${env:MONITOR}
monitor-strict = false
width = 100%
height = 32
radius = 0.0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
border-size = 0
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 2
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Material\\-Design\\-Iconic\\-Font:size=12;3"

modules-left = launcher workspaces term files browser
modules-center = date recording
modules-right = mpris pulseaudio wlan cpu memory temperature brightness battery sysmenu

tray-position = right
tray-padding = 2
enable-ipc = true

# ------------------------------------------------------------------
# Barra inferior (progresso da música)
# ------------------------------------------------------------------
[bar/bottom]
inherit = bar/main
bottom = true
height = 22
line-size = 0
modules-left =
modules-center = music
modules-right =
tray-position = none

# ------------------------------------------------------------------
# Módulos
# ------------------------------------------------------------------
[module/launcher]
type = custom/text
content = 
content-background = ${colors.primary}
content-foreground = ${colors.background}
content-padding = 3
click-left = launcher &
click-middle = wmmenu &
click-right = wpmenu &

[module/workspaces]
type = internal/i3
index-sort = true
wrapping-scroll = false
format = <label-state> <label-mode>
label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 3
label-unfocused = %index%
label-unfocused-foreground = ${color.foreground-alt}
label-unfocused-padding = 3
label-visible = %index%
label-visible-foreground = ${colors.primary}
label-visible-underline = ${colors.primary}
label-visible-padding = 3
label-urgent = %index%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 3
label-mode-padding = 2
label-mode-background = ${colors.alert}
label-mode-foreground = ${colors.background}

[module/apps]
type = custom/text
content-foreground = ${color.foreground-alt}
content-padding = 1

[module/term]
inherit = module/apps
content = 
click-left = kitty &

[module/files]
inherit = module/apps
content = 
click-left = thunar &

[module/browser]
inherit = module/apps
content = 
click-left = firefox &
click-right = helium-browser &

[module/mpris]
type = custom/script
exec = ~/.config/scripts/polybar_music.sh
interval = 1
click-left = playerctl play-pause
click-middle = playerctl previous
click-right = playerctl next
format-prefix = "♪ "
format-prefix-foreground = ${colors.primary}
format-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1.0
time = " %H:%M"
time-alt = " %a, %d %b"
label = %time%
format-prefix = 
format-prefix-foreground = ${colors.primary}
click-left = ~/.config/scripts/show_calendar.sh

[module/recording]
type = custom/script
exec = if [ -f /tmp/gpu-screen-recorder.pid ]; then echo "󰄀"; else echo "󰄄"; fi
interval = 1
tail = true
format = <label>
format-foreground = ${color.foreground-alt}
label = %output%
label-padding = 1
click-right = ~/.config/scripts/record_toggle.sh
click-left = maim -s ~/Imagens/screenshot-area-$(date +%d%m%Y-%H%M%S).png

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
label-volume = " %percentage:2%%"
label-muted = "  %percentage:2%%"
label-muted-foreground = ${colors.disabled}
enable-scroll = true
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
click-right = pavucontrol

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
format-disconnected-prefix = 
format-disconnected-prefix-foreground = ${color.foreground-alt}
label-connected = " %essid%"
label-connected-foreground = ${colors.foreground}
label-disconnected = " offline"
label-disconnected-foreground = ${color.foreground-alt}
ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-foreground = ${colors.primary}
click-left = ~/.config/scripts/wifi_menu.sh

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = 
format-prefix-foreground = ${colors.primary}
label = " %percentage:2%%"
click-left = kitty -e btop
click-right = kitty -e btop

[module/memory]
type = internal/memory
interval = 1
format-prefix = 
format-prefix-foreground = ${colors.primary}
label = " %mb_used%"
click-left = kitty -e btop
click-right = kitty -e btop

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
warn-temperature = 80
format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.alert}
label = %temperature-c%
label-warn = %temperature-c%
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
ramp-5 = 

[module/brightness]
type = custom/script
exec = brightnessctl -m | awk -F, '{printf "%2s", $4}'
interval = 1
format = <label>
format-prefix = 
format-prefix-foreground = ${color.foreground-alt}
label = %output%
label-foreground = ${colors.foreground}
click-left = brightnessctl set +5%
click-right = brightnessctl set 5%-

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5
full-at = 99
low-at = 15
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-low = <label-low>
label-charging = " %percentage%%"
label-discharging = " %percentage%% (%time%)"
label-low = "  %percentage%% (baixo)"
label-low-foreground = ${colors.alert}
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
ramp-capacity-6 = 
ramp-capacity-7 = 
ramp-capacity-8 = 
ramp-capacity-9 = 
animation-charging-0 = 
animation-charging-1 = 
animation-charging-framerate = 750

[module/music]
type = custom/script
exec = ~/.config/scripts/music_progress.sh | tail -1 | sed 's/%/%%/g'
interval = 1
click-left = playerctl play-pause
click-middle = playerctl previous
click-right = playerctl next
format = <label>
format-prefix = "󰓙 "
format-prefix-foreground = ${colors.primary}
label = %output%
label-foreground = ${colors.foreground}

[module/sysmenu]
type = custom/text
content = 
content-background = ${colors.primary}
content-foreground = ${colors.background}
content-padding = 3
click-left = ~/.config/polybar/material/scripts/powermenu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = true