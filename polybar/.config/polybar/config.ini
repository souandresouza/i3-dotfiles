include-file = ~/.cache/wal/polybar-colors.ini

[bar/main]
monitor = ${env:MONITOR}
monitor-strict = false
width = 100%
height = 32
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
padding-left = 0
padding-right = 2
module-margin-left = 1
module-margin-right = 2
font-0 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"
modules-left = ${env:WM_MODULE}
modules-center = date recording
modules-right = mpris pulseaudio wlan cpu memory temperature brightness battery powermenu
tray-position = right
tray-padding = 2
enable-ipc = true
wm-restack = i3

# --- Barra inferior (progresso da música) ---
[bar/bottom]
inherit = bar/main
bottom = true
height = 22
line-size = 0
modules-left =
modules-center = music
modules-right =
tray-position = none

# --- Workspaces (i3) ---
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2

# --- Módulos de sistema ---
[module/mpris]
type = custom/script
exec = ~/.config/scripts/polybar_music.sh
interval = 1
click-left = playerctl play-pause
click-middle = playerctl previous
click-right = playerctl next
format-prefix = "♪ "
format-prefix-foreground = ${colors.primary}
format-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
click-left = kitty -e btop
click-right = kitty -e btop

[module/memory]
type = internal/memory
interval = 1
format-prefix = "MEM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%
click-left = kitty -e btop
click-right = kitty -e btop

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
warn-temperature = 80
format = <ramp> <label>
format-foreground = ${colors.foreground}
format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.alert}
label = %temperature-c%
label-warn = %temperature-c%
ramp-0 = 󱌶
ramp-1 = 󱌷
ramp-2 = 󱌸
ramp-3 = 󰈸
ramp-4 = 󱌹
ramp-0-foreground = ${colors.primary}
ramp-1-foreground = ${colors.primary}
ramp-2-foreground = ${colors.primary}
ramp-3-foreground = ${colors.alert}
ramp-4-foreground = ${colors.alert}

[module/brightness]
type = custom/script
exec = brightnessctl -m | awk -F, '{printf "󰃠 %2s", $4}'
interval = 1
format = <label>
label = %output%
label-foreground = ${colors.foreground}
click-left = brightnessctl set +5%
click-right = brightnessctl set 5%-

[module/music]
type = custom/script
exec = ~/.config/scripts/music_progress.sh | tail -1 | sed 's/%/%%/g'
interval = 1
click-left = playerctl play-pause
click-middle = playerctl previous
click-right = playerctl next
format = <label>
format-prefix = "󰓙 "
format-prefix-foreground = ${colors.primary}
label = %output%
label-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = " %d-%m-%Y"
time = %H:%M:%S
label = %date% %time%
label-foreground = ${colors.primary}
click-left = ~/.config/scripts/show_calendar.sh

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "󰕾 %percentage:2%%"
label-muted = "󰝟 %percentage:2%%"
label-muted-foreground = ${colors.disabled}
enable-scroll = true
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
mutedclick-right = pavucontrol

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid%
label-connected-foreground = ${colors.text}
format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.accent}
label-disconnected = offline
label-disconnected-foreground = ${colors.accent}
click-left = ~/.config/scripts/wifi_menu.sh

[module/recording]
type = custom/script
exec = if [ -f /tmp/gpu-screen-recorder.pid ]; then echo "󰄀"; else echo "󰄄"; fi
interval = 1
tail = true
format = <label>
format-foreground = ${colors.accent}
label = %output%
label-padding = 1
click-right = ~/.config/scripts/record_toggle.sh
click-left = maim -s ~/Imagens/screenshot-area-$(date +%d%m%Y-%H%M%S).png

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5
full-at = 99
low-at = 15
format-charging = <animation-charging> <label-charging>
format-discharging = <label-discharging>
format-low = <label-low>
label-charging = %percentage%%
label-discharging = %percentage%% (%time%)
label-low = 󰁺 %percentage%% (baixo)
label-low-foreground = ${colors.alert}
animation-charging-0 = "⚡"
animation-charging-1 = "🔋"
animation-charging-framerate = 750

# --- Menu de energia ---
[module/powermenu]
type = custom/menu
expand-right = false
menu-0-0 = 󰐦 Desligar
menu-0-0-exec = systemctl poweroff
menu-0-1 = 󰌾 Bloquear
menu-0-1-exec = lock
menu-0-2 = 󰐥 Reiniciar
menu-0-2-exec = systemctl reboot
menu-0-0-foreground = ${colors.alert}
menu-0-1-foreground = ${colors.foreground}
menu-0-2-foreground = ${colors.foreground}
label-open = 󰐊
label-open-foreground = ${colors.primary}
label-close = 󰐊
label-close-foreground = ${colors.primary}
label-separator = " "

[settings]
screenchange-reload = true
pseudo-transparency = true
